- id: "macropad_enc3_click_toggle_mode"
  alias: "MacroPad - Toggle Encoder 3 Selection/Speed Mode"
  description: "Toggles between animation selection and speed when Encoder 3 is clicked with modifier"
  trigger:
    - platform: mqtt
      topic: macropad/input
  condition:
    - condition: template
      value_template: >
        {{ trigger.payload_json is defined and
           trigger.payload_json.action == 'encoder_click' and 
           trigger.payload_json.id == 3 and 
           trigger.payload_json.modifier == true }}
  action:
    - action: input_select.select_next
      target:
        entity_id: input_select.ceiling_enc3_mode
    - action: mqtt.publish
      data:
        topic: macropad/display
        payload: >
          {"popup": "ENC3:\n{{ states('input_select.ceiling_enc3_mode') | title }}"}
  mode: single

- id: "macropad_encoder_3_scroll"
  alias: "MacroPad - Encoder 3 Animations and Speed"
  description: "Cycles animations or adjusts speed depending on Encoder 3 mode"
  trigger:
    - platform: mqtt
      topic: macropad/input
  condition:
    - condition: template
      value_template: >
        {{ trigger.payload_json is defined and
           trigger.payload_json.action == 'encoder_scroll' and 
           trigger.payload_json.id == 3 and 
           trigger.payload_json.modifier == true }}
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.ceiling_enc3_mode') == 'speed' }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.ceiling_animation_speed
              data:
                value: >
                  {% set cur = states('input_number.ceiling_animation_speed') | float(50) %}
                  {% set delta = trigger.payload_json.delta | float(0) %}
                  {% set target = cur + (delta * 5) %}
                  {{ [ 1, [ 100, target ] | min ] | max | round(0) }}
            - action: mqtt.publish
              data:
                topic: macropad/display
                payload: >
                  {"popup": "SPEED:\n{{ states('input_number.ceiling_animation_speed') | int }}%"}
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.ceiling_enc3_mode') == 'selection' }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ trigger.payload_json.delta > 0 }}"
                  sequence:
                    - action: input_select.select_next
                      target:
                        entity_id: input_select.ceiling_animation
              default:
                - action: input_select.select_previous
                  target:
                    entity_id: input_select.ceiling_animation
            - action: mqtt.publish
              data:
                topic: macropad/display
                payload: >
                  {"popup": "ANIM:\n{{ states('input_select.ceiling_animation') }}"}
  mode: restart

- id: "ceiling_animation_runner"
  alias: "Ceiling - Animation Runner"
  description: "Starts/stops lighting animation scripts when animation mode changes"
  trigger:
    - platform: state
      entity_id: input_select.ceiling_animation
  action:
    - action: script.ceiling_stop_animations
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Rainbow Spin' }}"
          sequence:
            - action: script.ceiling_anim_rainbow
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Color Chill' }}"
          sequence:
            - action: script.ceiling_anim_chill
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Party Disco' }}"
          sequence:
            - action: script.ceiling_anim_disco
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Breathing' }}"
          sequence:
            - action: script.ceiling_anim_breathing
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Warm-Cool Wave' }}"
          sequence:
            - action: script.ceiling_anim_warm_cool
  mode: restart

- id: "macropad_preset_save"
  alias: "MacroPad - Save Preset"
  description: "Saves current light state to preset when modifier + long press on matrix key"
  trigger:
    - platform: mqtt
      topic: macropad/input
  condition:
    - condition: template
      value_template: >
        {{ trigger.payload_json is defined and
           trigger.payload_json.action == 'preset_save' and 
           trigger.payload_json.index is defined }}
  action:
    - action: input_text.set_value
      target:
        entity_id: "input_text.ceiling_preset_{{ trigger.payload_json.index }}"
      data:
        value: >
          {% set lm = state_attr('light.inteligent_ceiling_light', 'color_mode') %}
          {% set bri = state_attr('light.inteligent_ceiling_light', 'brightness') | default(128, true) %}
          {% if lm == 'hs' %}
            {% set hs = state_attr('light.inteligent_ceiling_light', 'hs_color') | default([0, 100], true) %}
            {"mode":"hs","hue":{{ hs[0] | round(0) }},"sat":{{ hs[1] | round(0) }},"bri":{{ bri }}}
          {% else %}
            {% set ct = state_attr('light.inteligent_ceiling_light', 'color_temp_kelvin') | default(4000, true) %}
            {"mode":"temp","temp":{{ ct }},"bri":{{ bri }}}
          {% endif %}
    - action: mqtt.publish
      data:
        topic: macropad/display
        payload: >
          {"popup": "PRESET {{ trigger.payload_json.index }}\nSAVED!"}
  mode: single

- id: "macropad_preset_recall"
  alias: "MacroPad - Recall Preset"
  description: "Recalls preset when modifier + tap on matrix key"
  trigger:
    - platform: mqtt
      topic: macropad/input
  condition:
    - condition: template
      value_template: >
        {{ trigger.payload_json is defined and
           trigger.payload_json.action == 'preset_recall' and 
           trigger.payload_json.index is defined }}
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not is_state('input_select.ceiling_animation', 'Static') }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.ceiling_animation
              data:
                option: "Static"
            - action: script.ceiling_stop_animations
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set entity = 'input_text.ceiling_preset_' ~ trigger.payload_json.index %}
                {{ states(entity) != '' and states(entity) != 'unknown' and states(entity) != 'unavailable' }}
          sequence:
            - variables:
                preset: >
                  {% set entity = 'input_text.ceiling_preset_' ~ trigger.payload_json.index %}
                  {{ states(entity) | from_json }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ preset.mode == 'hs' }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.inteligent_ceiling_light
                      data:
                        brightness: "{{ preset.bri }}"
                        hs_color:
                          - "{{ preset.hue }}"
                          - "{{ preset.sat }}"
                    - action: input_number.set_value
                      target:
                        entity_id: input_number.ceiling_hue
                      data:
                        value: "{{ preset.hue }}"
              default:
                - action: light.turn_on
                  target:
                    entity_id: light.inteligent_ceiling_light
                  data:
                    brightness: "{{ preset.bri }}"
                    color_temp_kelvin: "{{ preset.temp }}"
                - action: input_number.set_value
                  target:
                    entity_id: input_number.ceiling_colortemp
                  data:
                    value: "{{ preset.temp }}"
            - action: mqtt.publish
              data:
                topic: macropad/display
                payload: >
                  {"popup": "PRESET {{ trigger.payload_json.index }}\nACTIVATED"}
      default:
        - action: mqtt.publish
          data:
            topic: macropad/display
            payload: >
              {"popup": "PRESET {{ trigger.payload_json.index }}\nEMPTY"}
  mode: restart
